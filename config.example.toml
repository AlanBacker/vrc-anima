# Anima 配置示例 —— 复制为 config.toml 后按需修改。
# 所有键都有内置默认值;最少只需要填一个 Gemini API key(或设环境变量 GEMINI_API_KEY)。

[core]
name = "Anima"            # bot 名:也是唤醒模式的默认唤醒词
data_dir = "./data"       # 记忆 / 缓存 / 账单存放目录
persona_file = "persona.md"
log_level = "INFO"

[osc]
# VRChat 启动参数需与此对应:--osc=9000:127.0.0.1:9001
host = "127.0.0.1"
send_port = 9000
recv_port = 9001

[audio]
# 设备用 Pulse/PipeWire 名称(pactl list short sources / sinks 查看;空=系统默认)。
# 默认值对应 README 里 pactl load-module 建的两个虚拟声卡。
input_device = "anima_ears.monitor"   # 她的耳朵:游戏声音汇入的 sink 的 monitor
output_device = "anima_mouth"         # 她的嘴:VRChat 麦克风所指的 sink
sample_rate = 16000
echo_tail_ms = 300        # 半双工:说完话后多静默一小段,吃掉残响

[vad]
backend = "silero"        # silero(推荐)| energy(纯能量门限,兜底)
threshold = 0.5
silence_ms = 700          # 静音多久算一句话说完
min_speech_ms = 300
max_utterance_s = 30.0
pre_roll_ms = 300

[stt]
# Q20:转写模型选择权在用户——本地 SenseVoice,或任意 OpenAI 兼容端点
provider = "sensevoice"   # sensevoice(本地,pip install "vrc-anima[stt-local]")| openai(兼容端点)
base_url = ""             # provider=openai 时的端点,如 https://your-newapi.example.com/v1
api_key = ""              # 空则读环境变量 ANIMA_STT_API_KEY
model = "whisper-1"
language = ""             # 空=自动检测

[screen]
backend = "x11"           # x11 | none(关闭视觉;Wayland portal 在 M2)
monitor = 1               # mss 显示器序号
turn_frame_px = 768       # 回合帧长边像素;768 ≈ 258 tokens/帧
jpeg_quality = 80

[brain]
provider = "gemini"
max_history_turns = 20    # 滑动窗口轮数
attach_audio = false      # 原生音频增强开关:当回合额外附音频让模型听语气(费 tokens)
max_output_tokens = 1024

[brain.gemini]
model = "gemini-3.7-flash"
api_key = ""              # 空则读 GEMINI_API_KEY / GOOGLE_API_KEY
base_url = ""             # 走 New API 网关时填网关地址(原生 /v1beta 透传);空=直连
temperature = -1.0        # <0 用服务端默认

[tts]
provider = "edge"         # edge-tts,免费(目前唯一实现;provider 位可插拔)
voice = "zh-CN-XiaoyiNeural"
rate = "+0%"

[state]
mode = "always_on"        # always_on/常开 | gated/门控 | wakeword/唤醒(M1 默认常开)
engaged_idle_timeout_s = 60.0
wakeword = ""             # 空=用 core.name

[calibration]
turn_deg_per_sec = 90.0   # ⚠️ 实机标定:LookHorizontal 满轴每秒转多少度
enable_look_pitch = true  # ⚠️ /input/LookVertical 实测不生效就改 false
look_deg_per_sec = 90.0
move_max_seconds = 5.0

[chatbox]
enabled = true            # 说话文本自动镜像到聊天框(字幕)
max_chars = 144
notify_sound = false

[limits]
daily_usd = 0             # 当日 API 花费熔断线;0=不设限(默认)。填如 5.0 则当日超 $5 暂停回应,控制台 budget reset 解除,次日自动恢复
max_reply_chars = 600

[costs]
# 按所用模型的单价填写,用于成本仪表与熔断(gemini-3.7-flash 优惠价)
input_per_mtok = 0.75
output_per_mtok = 3.75

[memory]
enabled = true
session_key = "vrchat:main"  # 其他 memory_beyond 兼容程序指向同一数据目录+同键,即共享这份记忆

# Emote 映射:依所选 Avatar 的参数表配置(参数名在 Avatar 的 OSC json 里)
# [emotes]
# wave = { address = "/avatar/parameters/EmoteWave", value = 1, hold_ms = 500, reset_value = 0 }
# dance = { address = "/avatar/parameters/VRCEmote", value = 3, hold_ms = 3000, reset_value = 0 }
